name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build
        run: ./mvnw -B package -Drevision=${{ env.VERSION }} -DskipTests

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Gateway Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/gatekeeper-gateway:${{ github.ref_name }} \
                       -t ghcr.io/${{ github.repository }}/gatekeeper-gateway:latest \
                       ./gatekeeper-gateway
          docker push --all-tags ghcr.io/${{ github.repository }}/gatekeeper-gateway

      - name: Build & Push Analytics Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/gatekeeper-analytics:${{ github.ref_name }} \
                       -t ghcr.io/${{ github.repository }}/gatekeeper-analytics:latest \
                       ./gatekeeper-analytics
          docker push --all-tags ghcr.io/${{ github.repository }}/gatekeeper-analytics

      - name: Build & Push Admin Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/gatekeeper-admin:${{ github.ref_name }} \
                       -t ghcr.io/${{ github.repository }}/gatekeeper-admin:latest \
                       ./gatekeeper-admin
          docker push --all-tags ghcr.io/${{ github.repository }}/gatekeeper-admin

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
